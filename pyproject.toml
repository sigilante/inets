[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inets"
version = "0.1.3"
description = "Interaction nets: declare a system as a table of rules, check it, and reduce nets by it"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "N. E. Davis" }]
keywords = ["interaction nets", "interaction combinators", "combinatory logic", "graph rewriting", "Vine", "IVM"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/sigilante/inets"

[project.scripts]
inets = "inets.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"inets.systems" = ["*.rules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
