[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inets"
version = "0.1.0"
description = "Interaction nets: declare a system as a table of rules, check it, and reduce nets by it"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
inets = "inets.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"inets.systems" = ["*.rules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
