[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inets-kernel"
version = "0.1.2"
description = "A Jupyter kernel for interaction nets: write a table of rules, draw a net, and watch it reduce"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "N. E. Davis" }]
keywords = ["interaction nets", "jupyter", "kernel"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
]
dependencies = ["inets>=0.1.2", "ipykernel>=6", "jupyter_client>=7"]

[project.optional-dependencies]
test = ["pytest", "nbclient", "nbformat"]

[project.urls]
Repository = "https://github.com/sigilante/inets"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"inets_kernel" = ["kernelspec/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../src"]
